# Copy to travel.yml and replace the sample places with your own.
# Countries accept an ISO 3166-1 alpha-2 or alpha-3 code or an English name.
countries:
  - IS
  - NZ
  - CL

# US states accept a name or a USPS code. Only these states are filled.
# The rest of the United States stays the plain land color. Listing USA
# under countries fills the whole country instead.
us_states:
  - CO
  - ME

# Chinese first-level units: a province, autonomous region, or municipality
# name, or an ISO 3166-2 code. Only these are filled. The rest of China
# stays the plain land color. Listing China under countries fills the
# whole country instead.
china_provinces:
  - Zhejiang
  - Sichuan

# Japanese prefectures: a name or an ISO 3166-2 code. Hokkaido, Tokyo,
# Kyoto, and Osaka are included. Only these are filled. Listing Japan
# under countries fills the whole country instead.
japan_prefectures:
  - Kyoto
  - Hokkaido

cities:
  - name: Sample Harbor
    lat: 64.1500
    lon: -21.9500
  - name: Sample Ridge
    lat: -41.2900
    lon: 174.7800

# Not visited. Drawn in the palette accent. The SVG pulses these; the PNG
# keeps a static fill and dot. They are left out of visited counts.
planned_states:
  - OR

planned:
  - name: Sample Cove
    lat: 44.0000
    lon: -120.5000
