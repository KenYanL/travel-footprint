name: Travel Footprint
description: >-
  Render a Pacific-centred world map of visited countries, US states,
  Chinese provinces, Japanese prefectures, and cities. Writes one dark map
  and one light map. The default format is PNG. svg or both also writes SVG.
author: KenYanL

branding:
  icon: map
  color: green

inputs:
  config:
    description: >-
      Workspace path of the YAML file listing countries, us_states,
      china_provinces, japan_prefectures, cities, planned, and planned_states.
      ISO codes or English names for countries, state names or USPS codes,
      province and prefecture names or ISO 3166-2 codes, and city name plus
      lat/lon. planned cities use that same shape. planned_states are US
      state names or USPS codes. Planned places are drawn and are not
      counted as visited. Their pulse is SVG-only.
    required: false
    default: travel.yml
  output:
    description: >-
      Directory the map files are written to. Use dist when a later step
      publishes that directory.
    required: false
    default: dist
  palette:
    description: >-
      Map colors. default is green on the dark canvas. halloween uses orange
      and yellow. christmas uses Coolors' popular Christmas palette. newyear
      uses Color Hunt's gold gradient. auto uses newyear on 1 January (UTC),
      halloween on 31 October (UTC), christmas on 24-26 December (UTC), and
      default every other day. An empty value is rejected.
    required: false
    default: default
  format:
    description: >-
      Files to write. png writes travel-map.png and travel-map-light.png.
      svg writes travel-map.svg and travel-map-light.svg instead. both
      writes all four. Default png, so a workflow that omits this input
      still writes only the two PNGs. An empty value is rejected.
    required: false
    default: png
  badge:
    description: >-
      Write travel-badge.svg next to the map. true (the default) writes a
      self-contained SVG badge of countries visited, the percent of world
      countries, and US states, plus China provinces and Japan prefectures
      when those units are drawn. Planned states and planned cities are not
      included. false skips the badge and leaves the map files unchanged.
      An empty value is rejected.
    required: false
    default: "true"

outputs:
  map_dark_path:
    description: Path of the dark PNG, when format is png or both.
    value: ${{ steps.render.outputs.map_dark_path }}
  map_light_path:
    description: Path of the light PNG, when format is png or both.
    value: ${{ steps.render.outputs.map_light_path }}
  map_dark_svg_path:
    description: Path of the dark SVG, when format is svg or both.
    value: ${{ steps.render.outputs.map_dark_svg_path }}
  map_light_svg_path:
    description: Path of the light SVG, when format is svg or both.
    value: ${{ steps.render.outputs.map_light_svg_path }}
  badge_path:
    description: Path of travel-badge.svg, when badge is true.
    value: ${{ steps.render.outputs.badge_path }}

runs:
  using: composite
  steps:
    - name: Install travel-footprint dependencies
      shell: bash
      run: |
        set -euo pipefail
        if ! python3 -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)'; then
          echo "travel-footprint needs Python 3.10 or newer (ubuntu-latest already has it)." >&2
          exit 1
        fi
        venv="${RUNNER_TEMP:-/tmp}/travel-footprint-venv"
        python3 -m venv "$venv"
        "$venv/bin/python" -m pip install --disable-pip-version-check -r "${{ github.action_path }}/requirements.txt"
        echo "TRAVEL_PYTHON=$venv/bin/python" >> "$GITHUB_ENV"

    - name: Render travel map
      id: render
      shell: bash
      env:
        TRAVEL_CONFIG: ${{ inputs.config }}
        TRAVEL_OUTPUT: ${{ inputs.output }}
        TRAVEL_PALETTE: ${{ inputs.palette }}
        TRAVEL_FORMAT: ${{ inputs.format }}
        TRAVEL_BADGE: ${{ inputs.badge }}
      run: |
        set -euo pipefail
        python="${TRAVEL_PYTHON:-python3}"
        "$python" "${{ github.action_path }}/travel_footprint.py" \
          --config "$TRAVEL_CONFIG" \
          --out "$TRAVEL_OUTPUT" \
          --palette "${TRAVEL_PALETTE-default}" \
          --format "${TRAVEL_FORMAT-png}" \
          --badge "${TRAVEL_BADGE-true}"
        out="${TRAVEL_OUTPUT%/}"
        format="${TRAVEL_FORMAT-png}"
        format="${format#"${format%%[![:space:]]*}"}"
        format="${format%"${format##*[![:space:]]}"}"
        format="${format,,}"
        badge="${TRAVEL_BADGE-true}"
        badge="${badge#"${badge%%[![:space:]]*}"}"
        badge="${badge%"${badge##*[![:space:]]}"}"
        badge="${badge,,}"
        {
          if [[ "$format" == "png" || "$format" == "both" ]]; then
            echo "map_dark_path<<EOF"
            echo "$out/travel-map.png"
            echo "EOF"
            echo "map_light_path<<EOF"
            echo "$out/travel-map-light.png"
            echo "EOF"
          fi
          if [[ "$format" == "svg" || "$format" == "both" ]]; then
            echo "map_dark_svg_path<<EOF"
            echo "$out/travel-map.svg"
            echo "EOF"
            echo "map_light_svg_path<<EOF"
            echo "$out/travel-map-light.svg"
            echo "EOF"
          fi
          if [[ "$badge" == "true" ]]; then
            echo "badge_path<<EOF"
            echo "$out/travel-badge.svg"
            echo "EOF"
          fi
        } >> "$GITHUB_OUTPUT"
